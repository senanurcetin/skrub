name: OSS DataOps Basics DocTest QA

on:
  push:
    branches:
      - qa/dataops-basics-2002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataops-basics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install skrub
        run: python -m pip install -e .
      - name: Run copyable DataOps Basics doctests
        run: |
          python - <<'PY'
          import doctest

          path = "skrub/_docs/modules/data_ops/basics/what_are_data_ops.rst"
          failures, attempted = doctest.testfile(
              path,
              module_relative=False,
              encoding="utf-8",
              optionflags=doctest.ELLIPSIS,
          )
          assert attempted == 6, f"Expected 6 copyable Python snippets, ran {attempted}"
          assert failures == 0, f"{failures} DataOps Basics doctest failures"
          print(f"Passed {attempted} DataOps Basics doctests.")
          PY
      - name: Check internal documentation references
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path("skrub/_docs/modules/data_ops")
          sources = {
              "user_guide_data_ops_plan": base / "basics/building_data_ops_plan.rst",
              "user_guide_data_ops_exporting": base / "validation/exporting_data_ops.rst",
              "user_guide_data_ops_tuning_validating_dataops": base / "validation/tuning_validating_data_ops.rst",
          }
          for label, source in sources.items():
              assert source.is_file(), f"Missing referenced source: {source}"
              assert f".. _{label}:" in source.read_text(encoding="utf-8"), f"Missing Sphinx label: {label}"
          print("All three DataOps guide references resolve to existing labels.")
          PY
